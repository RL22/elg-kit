<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>elg-kit System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2.25rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>elg-kit System Topology & Data Flow</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="elg-kit-arch-title elg-kit-arch-desc">
      <title id="elg-kit-arch-title">elg-kit System Topology and Data Flow</title>
      <desc id="elg-kit-arch-desc">Architecture diagram showing signal ingestion from GitHub and webhooks into Vercel Eve agent, routing through Slack for targeted DMs and swarms, and redirecting via Cloudflare Edge with PostHog attribution telemetry.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- 1. Zones (drawn first) -->
      <!-- Ingestion Zone -->
      <rect x="40" y="80" width="220" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="56" y="74" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="104" y="83" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SIGNAL INGESTION</text>

      <!-- Orchestration Zone -->
      <rect x="296" y="80" width="384" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="312" y="74" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="83" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">AGENT ORCHESTRATION</text>

      <!-- Edge & Telemetry Zone -->
      <rect x="716" y="80" width="244" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="732" y="74" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="796" y="83" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">EDGE &amp; TELEMETRY</text>

      <!-- 2. Connectors (drawn before nodes) -->
      <!-- Ingest (GitHub) -> Eve Agent -->
      <path d="M 236,172 H 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="254" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="278" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>

      <!-- Ingest (Webhook) -> Eve Agent (elbow path) -->
      <path d="M 236,292 H 268 Q 276,292 276,284 V 200 Q 276,192 284,192 H 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Eve Agent -> Perspective Engine -->
      <path d="M 488,160 H 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="494" y="140" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRAFT</text>

      <!-- Perspective Engine -> Slack Interface (elbow) -->
      <path d="M 596,204 V 284 Q 596,292 588,292 H 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="532" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANGLES</text>

      <!-- Slack Interface -> Edge Redirect (Link Generation) -->
      <path d="M 484,320 H 708 Q 716,320 716,312 V 180 Q 716,172 724,172 H 736" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="628" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="309" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GEN LINK</text>

      <!-- Edge Redirect -> Telemetry Logger (async/dashed) -->
      <path d="M 836,204 V 272" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="844" y="230" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="874" y="239" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAITUNTIL</text>

      <!-- Telemetry -> Eve Agent (Weekly Impact Feedback Loop - dashed elbow) -->
      <path d="M 740,312 H 416 Q 408,312 408,304 V 224" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <rect x="424" y="322" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="462" y="331" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEEKLY RECAP</text>

      <!-- 3. Nodes (drawn after connectors) -->
      <!-- Node 1: GitHub / Linear -->
      <rect x="64" y="140" width="172" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="140" width="172" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="148" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="94" y="157" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
      <text x="150" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Release Watcher</text>
      <text x="150" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">github/linear/rss</text>

      <!-- Node 2: Generic Signals Webhook -->
      <rect x="64" y="260" width="172" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="260" width="172" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="268" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="94" y="277" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INGEST</text>
      <text x="150" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signals API</text>
      <text x="150" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/signals</text>

      <!-- Node 3: Vercel Eve Agent (Focal 1) -->
      <rect x="320" y="132" width="168" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="132" width="168" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="328" y="140" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="352" y="149" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE AGENT</text>
      <text x="404" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vercel Eve Runtime</text>
      <text x="404" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent/instructions.md</text>
      <text x="404" y="196" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">voice-profiler: opt-in</text>

      <!-- Node 4: Perspective Engine -->
      <rect x="532" y="132" width="132" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="532" y="132" width="132" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="540" y="140" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="558" y="149" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="598" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">elg-engine</text>
      <text x="598" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 role perspectives</text>

      <!-- Node 5: Slack Interface -->
      <rect x="320" y="260" width="168" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="260" width="168" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="268" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="352" y="277" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHANNEL</text>
      <text x="404" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Slack Showcase Hub</text>
      <text x="404" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review | showcase | /link</text>

      <!-- Node 6: Edge Redirect Router (Focal 2) -->
      <rect x="740" y="140" width="196" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="140" width="196" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="748" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="772" y="157" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
      <text x="838" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Edge Redirect Router</text>
      <text x="838" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allowlist + bot-filter (&lt;5ms)</text>

      <!-- Node 7: Telemetry & Ingestion -->
      <rect x="740" y="276" width="196" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="276" width="196" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="748" y="284" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="772" y="293" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORAGE</text>
      <text x="838" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Attribution Logger</text>
      <text x="838" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cf analytics + client posthog</text>

      <!-- 4. Legend Strip (at bottom) -->
      <line x1="40" y1="520" x2="960" y2="520" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="538" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <!-- Legend items -->
      <rect x="120" y="530" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="539" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Focal Component</text>

      <rect x="280" y="530" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="539" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Standard Module</text>

      <line x1="440" y1="536" x2="464" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="472" y="539" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Synchronous Call</text>

      <line x1="610" y1="536" x2="634" y2="536" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="642" y="539" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Async Telemetry</text>

      <line x1="770" y1="536" x2="794" y2="536" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <text x="802" y="539" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Feedback Loop</text>
    </svg>
  </div>
</body>
</html>
